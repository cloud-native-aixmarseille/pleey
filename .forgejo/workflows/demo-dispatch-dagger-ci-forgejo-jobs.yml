name: Demo Dispatch CI - Dagger Forgejo Jobs

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: demo-dispatch-dagger-ci-forgejo-jobs-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-temp-metadata:
    name: Prepare metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      registry: ${{ steps.prepare_outputs.outputs.registry }}
      backend-image-repository: ${{ steps.prepare_outputs.outputs.backend_image_repository }}
      frontend-image-repository: ${{ steps.prepare_outputs.outputs.frontend_image_repository }}
      chart-repository: ${{ steps.prepare_outputs.outputs.chart_repository }}
      image-tag: ${{ steps.prepare_outputs.outputs.image_tag }}
      chart-version: ${{ steps.prepare_outputs.outputs.chart_version }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve OCI registry
        id: resolve_registry
        env:
          OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
        run: |
          set -euo pipefail

          resolved_registry="${OCI_REGISTRY:-ghcr.io}"

          if [[ -z "${OCI_REGISTRY}" ]]; then
            echo "::warning::Repository variable OCI_REGISTRY is unset. Defaulting to ${resolved_registry}."
          fi

          echo "registry=${resolved_registry}" >> "$GITHUB_OUTPUT"

      - name: Allow Docker socket access for act
        run: |
          if [[ "${ACT:-}" != "true" ]]; then
            exit 0
          fi

          if [ -f /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || chmod 666 /var/run/docker.sock
          fi

      - name: Prepare artifacts
        id: prepare_artifacts
        uses: https://github.com/dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          call: |
            prepare-temp-artifacts \
            --oci-registry='${{ steps.resolve_registry.outputs.registry }}' \
            --repository='${{ github.repository }}' \
            --run-number='${{ github.run_number }}' \
            --run-attempt='${{ github.run_attempt }}' \
            --git-sha='${{ github.sha }}'

      - name: Extract prepare outputs
        id: prepare_outputs
        env:
          PREPARE_JSON: ${{ steps.prepare_artifacts.outputs.stdout }}
        run: |
          set -euo pipefail

          {
            echo "registry=$(printf '%s' "$PREPARE_JSON" | jq -r '.registry')"
            echo "backend_image_repository=$(printf '%s' "$PREPARE_JSON" | jq -r '.backendImageRepository')"
            echo "frontend_image_repository=$(printf '%s' "$PREPARE_JSON" | jq -r '.frontendImageRepository')"
            echo "chart_repository=$(printf '%s' "$PREPARE_JSON" | jq -r '.chartRepository')"
            echo "image_tag=$(printf '%s' "$PREPARE_JSON" | jq -r '.imageTag')"
            echo "chart_version=$(printf '%s' "$PREPARE_JSON" | jq -r '.chartVersion')"
          } >> "$GITHUB_OUTPUT"

  lint-and-test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Allow Docker socket access for act
        run: |
          if [[ "${ACT:-}" != "true" ]]; then
            exit 0
          fi

          if [ -f /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || chmod 666 /var/run/docker.sock
          fi

      - name: Lint and test ${{ matrix.service }}
        uses: https://github.com/dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          call: |
            lint-and-test-${{ matrix.service }} \
            --source=.

  build-temp-images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [prepare-temp-metadata, lint-and-test]
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.resolve_registry.outputs.registry }}
      backend-image-repository: ${{ steps.prepare_coordinates.outputs.backend_image_repository }}
      frontend-image-repository: ${{ steps.prepare_coordinates.outputs.frontend_image_repository }}
      image-tag: ${{ steps.prepare_coordinates.outputs.image_tag }}
      chart-version: ${{ steps.prepare_coordinates.outputs.chart_version }}
      chart-repository: ${{ steps.prepare_coordinates.outputs.chart_repository }}
      backend-digest: ${{ steps.backend_image_outputs.outputs.digest }}
      frontend-digest: ${{ steps.frontend_image_outputs.outputs.digest }}
      backend-image-reference: ${{ steps.backend_image_outputs.outputs.reference }}
      frontend-image-reference: ${{ steps.frontend_image_outputs.outputs.reference }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve OCI registry
        id: resolve_registry
        env:
          OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
        run: |
          set -euo pipefail

          resolved_registry="${OCI_REGISTRY:-ghcr.io}"

          if [[ -z "${OCI_REGISTRY}" ]]; then
            echo "::warning::Repository variable OCI_REGISTRY is unset. Defaulting to ${resolved_registry}."
          fi

          echo "registry=${resolved_registry}" >> "$GITHUB_OUTPUT"

      - name: Prepare coordinates
        id: prepare_coordinates
        env:
          OCI_REGISTRY: ${{ steps.resolve_registry.outputs.registry }}
        run: |
          set -euo pipefail

          repository_slug="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_tag="demo-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          chart_version="0.0.0-demo.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          {
            echo "backend_image_repository=${OCI_REGISTRY}/${repository_slug}/demo/backend"
            echo "frontend_image_repository=${OCI_REGISTRY}/${repository_slug}/demo/frontend"
            echo "chart_repository=oci://${OCI_REGISTRY}/${repository_slug}/demo/charts"
            echo "image_tag=${image_tag}"
            echo "chart_version=${chart_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Allow Docker socket access for act
        run: |
          if [[ "${ACT:-}" != "true" ]]; then
            exit 0
          fi

          if [ -f /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || chmod 666 /var/run/docker.sock
          fi

      - name: Publish backend image
        id: publish_backend_image
        uses: https://github.com/dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          call: |
            publish-backend-image \
            --source=. \
            --oci-registry='${{ steps.resolve_registry.outputs.registry }}' \
            --registry-username='${{ github.actor }}' \
            --registry-password=env://GITHUB_TOKEN \
            --repository='${{ github.repository }}' \
            --run-number='${{ github.run_number }}' \
            --run-attempt='${{ github.run_attempt }}' \
            --git-sha='${{ github.sha }}'

      - name: Extract backend image outputs
        id: backend_image_outputs
        env:
          IMAGE_JSON: ${{ steps.publish_backend_image.outputs.stdout }}
        run: |
          set -euo pipefail

          {
            echo "reference=$(printf '%s' "$IMAGE_JSON" | jq -r '.reference')"
            echo "digest=$(printf '%s' "$IMAGE_JSON" | jq -r '.digest')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish frontend image
        id: publish_frontend_image
        uses: https://github.com/dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          call: |
            publish-frontend-image \
            --source=. \
            --oci-registry='${{ steps.resolve_registry.outputs.registry }}' \
            --registry-username='${{ github.actor }}' \
            --registry-password=env://GITHUB_TOKEN \
            --repository='${{ github.repository }}' \
            --run-number='${{ github.run_number }}' \
            --run-attempt='${{ github.run_attempt }}' \
            --git-sha='${{ github.sha }}'

      - name: Extract frontend image outputs
        id: frontend_image_outputs
        env:
          IMAGE_JSON: ${{ steps.publish_frontend_image.outputs.stdout }}
        run: |
          set -euo pipefail

          {
            echo "reference=$(printf '%s' "$IMAGE_JSON" | jq -r '.reference')"
            echo "digest=$(printf '%s' "$IMAGE_JSON" | jq -r '.digest')"
          } >> "$GITHUB_OUTPUT"

  release-temp-chart:
    name: Release chart
    runs-on: ubuntu-latest
    needs: [build-temp-images]
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve OCI registry
        id: resolve_registry
        env:
          OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
        run: |
          set -euo pipefail

          resolved_registry="${OCI_REGISTRY:-ghcr.io}"

          if [[ -z "${OCI_REGISTRY}" ]]; then
            echo "::warning::Repository variable OCI_REGISTRY is unset. Defaulting to ${resolved_registry}."
          fi

          echo "registry=${resolved_registry}" >> "$GITHUB_OUTPUT"

      - name: Allow Docker socket access for act
        run: |
          if [[ "${ACT:-}" != "true" ]]; then
            exit 0
          fi

          if [ -f /var/run/docker.sock ]; then
            sudo chmod 666 /var/run/docker.sock || chmod 666 /var/run/docker.sock
          fi

      - name: Release chart
        id: release_chart
        uses: https://github.com/dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          call: |
            release-temp-chart \
            --source=. \
            --oci-registry='${{ steps.resolve_registry.outputs.registry }}' \
            --registry-username='${{ github.actor }}' \
            --registry-password=env://GITHUB_TOKEN \
            --repository='${{ github.repository }}' \
            --run-number='${{ github.run_number }}' \
            --run-attempt='${{ github.run_attempt }}' \
            --git-sha='${{ github.sha }}' \
            --backend-digest='${{ needs.build-temp-images.outputs.backend-digest }}' \
            --frontend-digest='${{ needs.build-temp-images.outputs.frontend-digest }}' \
            --json
      - name: Summarize artifacts
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-temp-images.outputs.image-tag }}
          CHART_VERSION: ${{ needs.build-temp-images.outputs.chart-version }}
        run: |
          set -euo pipefail
          {
            echo "## Demo artifacts"
            echo
            echo "- Backend image tag: ${IMAGE_TAG}"
            echo "- Frontend image tag: ${IMAGE_TAG}"
            echo "- Helm chart version: ${CHART_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
