---
name: Shared - Continuous Integration

"on":
  workflow_call:
    inputs:
      documentation-only:
        description: Run repository and user-documentation checks for a classified documentation-only pull request. Main and release always run full CI.
        required: false
        type: boolean
        default: false
      production-image-tag:
        description: Force the production backend/frontend image tag.
        required: false
        type: string
        default: ""
    outputs:
      job-results:
        description: Actual job results for the calling pull request's validation gate.
        value: ${{ toJSON(jobs) }}
      built-prod-images:
        description: Validated production backend/frontend metadata returned after promotion.
        value: ${{ jobs.promote-images.outputs.built-images }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      linter-env: |
        MULTI_STATUS=false
        VALIDATE_BIOME_FORMAT=false
        VALIDATE_BIOME_LINT=false
        KUBERNETES_KUBECONFORM_OPTIONS=-ignore-missing-schemas -ignore-filename-pattern .*Chart\.yaml -ignore-filename-pattern .*values.*\.yaml -ignore-filename-pattern .*values\.schema\.json -ignore-filename-pattern charts/.*/templates/.* -ignore-filename-pattern charts/.*/crds/.*

  check-user-guides:
    name: Validate user guides
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            application/frontend/package-lock.json
            application/backend/package-lock.json
            e2e/package-lock.json
      - name: Install documentation and application dependencies
        run: |
          npm ci --prefix application/frontend
      - name: Install browser runtime dependencies
        if: github.event_name != 'pull_request' || !inputs.documentation-only
        run: |
          npm ci --prefix application/backend
          npm ci --prefix e2e
      - name: Validate reference and screenshot freshness
        run: node scripts/check-user-docs.mjs
      - name: Build test runtime images
        if: github.event_name != 'pull_request' || !inputs.documentation-only
        run: docker compose -p pleey build backend frontend
      - name: Validate guide routes, targets and accessibility
        if: github.event_name != 'pull_request' || !inputs.documentation-only
        run: ./scripts/run-usage-docs.sh check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: user-guide-browser-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  check-ci-routing:
    name: Test CI routing
    if: github.event_name != 'pull_request' || !inputs.documentation-only
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      packages: read
    with:
      working-directory: .github/actions/determine-pr-checks
      build: ""
      lint: ""
      test: '{"command":"test:ci","report-file":"junit.xml,coverage/lcov.info","comment":false}'
      code-ql: javascript
      dependency-review: true

  build-backend-ci-image:
    name: Build backend CI image
    if: github.event_name != 'pull_request' || !inputs.documentation-only
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "backend-ci",
            "context": ".",
            "dockerfile": "./application/backend/Dockerfile",
            "build-args": { "APP_PATH": "./application/backend/" },
            "target": "ci",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  check-backend:
    name: Lint and test backend
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
    needs: build-backend-ci-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      packages: read
    with:
      working-directory: /usr/src/app
      build: ""
      lint: '{"command":"lint:ci","report-file":"biome-report.sarif"}'
      test: '{"command":"test:ci","report-file":"junit.xml,coverage/lcov.info"}'
      container: |
        {
          "image": ${{ toJSON(fromJSON(needs.build-backend-ci-image.outputs.built-images)['backend-ci'].images[0]) }},
          "credentials": {
            "username": ${{ toJson(github.repository_owner) }}
          },
          "pathMapping": {
            "/usr/src/app": "./application/backend",
            "src/": "./application/backend/src/",
            "scripts/": "./application/backend/scripts/"
          }
        }
      code-ql: typescript
      dependency-review: true
    secrets:
      container-password: ${{ secrets.GITHUB_TOKEN }}

  build-frontend-ci-image:
    name: Build frontend CI image
    if: github.event_name != 'pull_request' || !inputs.documentation-only
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "frontend-ci",
            "context": ".",
            "dockerfile": "./application/frontend/Dockerfile",
            "build-args": { "APP_PATH": "./application/frontend/" },
            "target": "ci",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  check-frontend:
    name: Lint and test frontend
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
    needs: build-frontend-ci-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      packages: read
    with:
      working-directory: /usr/src/app
      build: ""
      lint: '{"command":"lint:ci","report-file":"biome-report.sarif"}'
      test: '{"command":"test:ci","report-file":"junit.xml,coverage/lcov.info"}'
      container: |
        {
          "image": ${{ toJSON(fromJSON(needs.build-frontend-ci-image.outputs.built-images)['frontend-ci'].images[0]) }},
          "credentials": {
            "username": ${{ toJson(github.repository_owner) }}
          },
          "pathMapping": {
            "/usr/src/app": "./application/frontend",
            "src/": "./application/frontend/src/",
            "scripts/": "./application/frontend/scripts/"
          }
        }
      code-ql: typescript
      dependency-review: true
    secrets:
      container-password: ${{ secrets.GITHUB_TOKEN }}

  build-backend-candidate:
    name: Build backend production candidate
    if: github.event_name != 'pull_request' || !inputs.documentation-only
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      candidate: true
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "backend",
            "tag": "${{ inputs.production-image-tag }}",
            "context": ".",
            "dockerfile": "./application/backend/Dockerfile",
            "build-args": { "APP_PATH": "./application/backend/" },
            "target": "prod",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-frontend-candidate:
    name: Build frontend production candidate
    if: github.event_name != 'pull_request' || !inputs.documentation-only
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      candidate: true
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "frontend",
            "tag": "${{ inputs.production-image-tag }}",
            "context": ".",
            "dockerfile": "./application/frontend/Dockerfile",
            "build-args": { "APP_PATH": "./application/frontend/" },
            "target": "prod",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  tests-charts:
    name: Test production candidates with Helm
    needs: [build-backend-candidate, build-frontend-candidate]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-ci.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      contents: read
      packages: read
    with:
      path: charts/application
      helm-repositories: |
        cloudnative-pg https://cloudnative-pg.github.io/charts
        valkey https://valkey.io/valkey-helm/
        bokysan https://bokysan.github.io/docker-postfix/
      helm-set: |
        backend.image.registry=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.registry }}
        backend.image.repository=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.repository }}
        backend.image.tag=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.tags[0] }}
        backend.image.digest=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.digest }}
        backend.cloudnativepgOperator.enabled=true
        frontend.image.registry=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.registry }}
        frontend.image.repository=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.repository }}
        frontend.image.tag=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.tags[0] }}
        frontend.image.digest=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.digest }}
        global.imagePullSecrets[0].name=regcred
      images: >-
        {
          "backend": ${{ toJSON(fromJSON(needs.build-backend-candidate.outputs.built-images).backend) }},
          "frontend": ${{ toJSON(fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend) }}
        }
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}

  promote-images:
    name: Promote validated production images
    if: always() && (github.event_name != 'pull_request' || !inputs.documentation-only)
    needs:
      - linter
      - check-ci-routing
      - check-user-guides
      - check-backend
      - check-frontend
      - build-backend-candidate
      - build-frontend-candidate
      - tests-charts
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-promote-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ toJSON(needs) }}
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
