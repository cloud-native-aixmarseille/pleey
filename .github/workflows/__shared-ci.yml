---
name: Shared - Continuous Integration

"on":
  workflow_call:
    inputs:
      production-image-tag:
        description: Force the production backend/frontend image tag.
        required: false
        type: string
        default: ""
    outputs:
      built-prod-images:
        description: Production backend/frontend build metadata.
        value: ${{ jobs.build-prod.outputs.built-images }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      linter-env: |
        VALIDATE_BIOME_FORMAT=false
        VALIDATE_BIOME_LINT=false
        KUBERNETES_KUBECONFORM_OPTIONS=-ignore-missing-schemas -ignore-filename-pattern .*Chart\.yaml -ignore-filename-pattern .*values.*\.yaml -ignore-filename-pattern .*values\.schema\.json -ignore-filename-pattern charts/.*/templates/.* -ignore-filename-pattern charts/.*/crds/.*

  build:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@79ab741d853f0cb8efd0823b497882c2d5995fc1 # 0.41.1
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "backend-ci",
            "context": ".",
            "dockerfile": "./application/backend/Dockerfile",
            "build-args": { "APP_PATH": "./application/backend/" },
            "target": "ci",
            "platforms": ["linux/amd64"]
          },
          {
            "name": "frontend-ci",
            "context": ".",
            "dockerfile": "./application/frontend/Dockerfile",
            "build-args": { "APP_PATH": "./application/frontend/" },
            "target": "ci",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  continuous-integration:
    strategy:
      matrix:
        service: ["backend", "frontend"]
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
    needs: build
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      packages: read
    with:
      working-directory: /usr/src/app
      build: ""
      lint: '{"command":"lint:ci","report-file":"biome-report.sarif"}'
      test: '{"command":"test:ci","report-file":"junit.xml,coverage/lcov.info"}'
      container: |
        {
          "image": ${{ toJSON(fromJSON(needs.build.outputs.built-images)[format('{0}-ci', matrix.service)].images[0]) }},
          "credentials": {
            "username": ${{ toJson(github.repository_owner) }}
          },
          "pathMapping": {
            "/usr/src/app": ${{ toJson(format('./application/{0}', matrix.service)) }},
            "src/": ${{ toJson(format('./application/{0}/src/', matrix.service)) }},
            "scripts/": ${{ toJson(format('./application/{0}/scripts/', matrix.service)) }}
          }
        }
      code-ql: "" # FIXME: Set `typescript` when CodeQL will be available (paid feature)
      dependency-review: false # FIXME: Set `true` when Dependency Review will be available (paid feature)
    secrets:
      container-password: ${{ secrets.GITHUB_TOKEN }}

  build-prod:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@79ab741d853f0cb8efd0823b497882c2d5995fc1 # 0.41.1
    needs: continuous-integration
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "backend",
            "tag": "${{ inputs.production-image-tag }}",
            "context": ".",
            "dockerfile": "./application/backend/Dockerfile",
            "build-args": { "APP_PATH": "./application/backend/" },
            "target": "prod",
            "platforms": ["linux/amd64"]
          },
          {
            "name": "frontend",
            "tag": "${{ inputs.production-image-tag }}",
            "context": ".",
            "dockerfile": "./application/frontend/Dockerfile",
            "build-args": { "APP_PATH": "./application/frontend/" },
            "target": "prod",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  tests-charts:
    runs-on: ubuntu-latest
    needs: build-prod
    permissions:
      contents: read
      packages: read
    steps:
      - name: Test helm chart (umbrella)
        uses: hoverkraft-tech/ci-github-container/actions/helm/test-chart@79ab741d853f0cb8efd0823b497882c2d5995fc1 # 0.41.1
        with:
          helm-repositories: |
            cloudnative-pg https://cloudnative-pg.github.io/charts
            valkey https://valkey.io/valkey-helm/
            bokysan https://bokysan.github.io/docker-postfix/
          helm-set: |
            backend.image.registry=${{ fromJSON(needs.build-prod.outputs.built-images).backend.registry }}
            backend.image.repository=${{ fromJSON(needs.build-prod.outputs.built-images).backend.repository }}
            backend.image.tag=${{ fromJSON(needs.build-prod.outputs.built-images).backend.tags[0] }}
            backend.image.digest=${{ fromJSON(needs.build-prod.outputs.built-images).backend.digest }}
            backend.cloudnativepgOperator.enabled=true
            frontend.image.registry=${{ fromJSON(needs.build-prod.outputs.built-images).frontend.registry }}
            frontend.image.repository=${{ fromJSON(needs.build-prod.outputs.built-images).frontend.repository }}
            frontend.image.tag=${{ fromJSON(needs.build-prod.outputs.built-images).frontend.tags[0] }}
            frontend.image.digest=${{ fromJSON(needs.build-prod.outputs.built-images).frontend.digest }}
            global.imagePullSecrets[0].name=regcred
          oci-registry: ${{ vars.OCI_REGISTRY }}
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ github.token }}
