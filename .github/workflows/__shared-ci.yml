---
name: Shared - Continuous Integration

"on":
  workflow_call:
    inputs:
      production-image-tag:
        description: Force the production backend/frontend image tag.
        required: false
        type: string
        default: ""
    outputs:
      built-prod-images:
        description: Validated production backend/frontend metadata returned after promotion.
        value: ${{ jobs.promote-images.outputs.built-images }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      linter-env: |
        VALIDATE_BIOME_FORMAT=false
        VALIDATE_BIOME_LINT=false
        KUBERNETES_KUBECONFORM_OPTIONS=-ignore-missing-schemas -ignore-filename-pattern .*Chart\.yaml -ignore-filename-pattern .*values.*\.yaml -ignore-filename-pattern .*values\.schema\.json -ignore-filename-pattern charts/.*/templates/.* -ignore-filename-pattern charts/.*/crds/.*

  build-backend-ci-image:
    name: Build backend CI image
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@ca71afa42c37bdd67ec2ca685fd2ff73d76190e8 # 0.42.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "backend-ci",
            "context": ".",
            "dockerfile": "./application/backend/Dockerfile",
            "build-args": { "APP_PATH": "./application/backend/" },
            "target": "ci",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  check-backend:
    name: Lint and test backend
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
    needs: build-backend-ci-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      packages: read
    with:
      working-directory: /usr/src/app
      build: ""
      lint: '{"command":"lint:ci","report-file":"biome-report.sarif"}'
      test: '{"command":"test:ci","report-file":"junit.xml,coverage/lcov.info"}'
      container: |
        {
          "image": ${{ toJSON(fromJSON(needs.build-backend-ci-image.outputs.built-images)['backend-ci'].images[0]) }},
          "credentials": {
            "username": ${{ toJson(github.repository_owner) }}
          },
          "pathMapping": {
            "/usr/src/app": "./application/backend",
            "src/": "./application/backend/src/",
            "scripts/": "./application/backend/scripts/"
          }
        }
      code-ql: "" # FIXME: Set `typescript` when CodeQL will be available (paid feature)
      dependency-review: false # FIXME: Set `true` when Dependency Review will be available (paid feature)
    secrets:
      container-password: ${{ secrets.GITHUB_TOKEN }}

  build-frontend-ci-image:
    name: Build frontend CI image
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@ca71afa42c37bdd67ec2ca685fd2ff73d76190e8 # 0.42.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "frontend-ci",
            "context": ".",
            "dockerfile": "./application/frontend/Dockerfile",
            "build-args": { "APP_PATH": "./application/frontend/" },
            "target": "ci",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  check-frontend:
    name: Lint and test frontend
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
    needs: build-frontend-ci-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      packages: read
    with:
      working-directory: /usr/src/app
      build: ""
      lint: '{"command":"lint:ci","report-file":"biome-report.sarif"}'
      test: '{"command":"test:ci","report-file":"junit.xml,coverage/lcov.info"}'
      container: |
        {
          "image": ${{ toJSON(fromJSON(needs.build-frontend-ci-image.outputs.built-images)['frontend-ci'].images[0]) }},
          "credentials": {
            "username": ${{ toJson(github.repository_owner) }}
          },
          "pathMapping": {
            "/usr/src/app": "./application/frontend",
            "src/": "./application/frontend/src/",
            "scripts/": "./application/frontend/scripts/"
          }
        }
      code-ql: "" # FIXME: Set `typescript` when CodeQL will be available (paid feature)
      dependency-review: false # FIXME: Set `true` when Dependency Review will be available (paid feature)
    secrets:
      container-password: ${{ secrets.GITHUB_TOKEN }}

  build-backend-candidate:
    name: Build backend production candidate
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@ca71afa42c37bdd67ec2ca685fd2ff73d76190e8 # 0.42.0
    needs: build-backend-ci-image
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      candidate: true
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "backend",
            "tag": "${{ inputs.production-image-tag }}",
            "context": ".",
            "dockerfile": "./application/backend/Dockerfile",
            "build-args": { "APP_PATH": "./application/backend/" },
            "target": "prod",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-frontend-candidate:
    name: Build frontend production candidate
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@ca71afa42c37bdd67ec2ca685fd2ff73d76190e8 # 0.42.0
    needs: build-frontend-ci-image
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      candidate: true
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      images: |
        [
          {
            "name": "frontend",
            "tag": "${{ inputs.production-image-tag }}",
            "context": ".",
            "dockerfile": "./application/frontend/Dockerfile",
            "build-args": { "APP_PATH": "./application/frontend/" },
            "target": "prod",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  tests-charts:
    name: Test production candidates with Helm
    runs-on: ubuntu-latest
    needs: [build-backend-candidate, build-frontend-candidate]
    outputs:
      validated-images: ${{ job.status == 'success' && steps.validated.outputs.images || '' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Test helm chart (umbrella)
        uses: hoverkraft-tech/ci-github-container/actions/helm/test-chart@ca71afa42c37bdd67ec2ca685fd2ff73d76190e8 # 0.42.0
        with:
          check-diff-only: false
          helm-repositories: |
            cloudnative-pg https://cloudnative-pg.github.io/charts
            valkey https://valkey.io/valkey-helm/
            bokysan https://bokysan.github.io/docker-postfix/
          helm-set: |
            backend.image.registry=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.registry }}
            backend.image.repository=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.repository }}
            backend.image.tag=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.tags[0] }}
            backend.image.digest=${{ fromJSON(needs.build-backend-candidate.outputs.built-images).backend.digest }}
            backend.cloudnativepgOperator.enabled=true
            frontend.image.registry=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.registry }}
            frontend.image.repository=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.repository }}
            frontend.image.tag=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.tags[0] }}
            frontend.image.digest=${{ fromJSON(needs.build-frontend-candidate.outputs.built-images).frontend.digest }}
            global.imagePullSecrets[0].name=regcred
          oci-registry: ${{ vars.OCI_REGISTRY }}
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ github.token }}

      - name: Record chart-validated candidate digests
        id: validated
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BACKEND_IMAGES: ${{ needs.build-backend-candidate.outputs.built-images }}
          FRONTEND_IMAGES: ${{ needs.build-frontend-candidate.outputs.built-images }}
        with:
          script: |
            const backend = JSON.parse(process.env.BACKEND_IMAGES);
            const frontend = JSON.parse(process.env.FRONTEND_IMAGES);
            core.setOutput('images', JSON.stringify({ ...backend, ...frontend }));

  promote-images:
    name: Promote validated production images
    if: always()
    needs:
      - linter
      - check-backend
      - check-frontend
      - build-backend-candidate
      - build-frontend-candidate
      - tests-charts
    # Preview of upstream PR #962; replace with its reviewed release before merging.
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-promote-images.yml@b75829d1621f894b4f50884b8759fcf362d11d9a
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ toJSON(needs) }}
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
