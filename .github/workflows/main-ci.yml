---
name: Main - Continuous Integration

"on":
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  clean:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/prune-pull-requests-images-tags.yml@00958991595e51ab23139e37af35c542d4009b2e # merged PR 979
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read
    with:
      images: '["backend","frontend","backend-ci","frontend-ci"]'

  ci:
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      attestations: write
      checks: write
      contents: read
      deployments: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write

  helm-docs:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether Helm docs inputs changed
        id: docs-scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const script = require('node:url').pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-helm-docs.mjs`);
            const { needsHelmDocs } = await import(script.href);
            const required = await needsHelmDocs({ github, context, attempt: Number(process.env.RUN_ATTEMPT) });
            core.setOutput('required', required);
            core.info(required ? 'Generate Helm documentation.' : 'Helm documentation inputs are unchanged since successful main CI.');

      - uses: hoverkraft-tech/ci-github-container/actions/helm/generate-docs@00958991595e51ab23139e37af35c542d4009b2e # merged PR 979
        if: steps.docs-scope.outputs.required == 'true'
        with:
          working-directory: ./charts
          github-app-client-id: ${{ vars.CI_BOT_APP_ID }}
          github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] repository automation uses a dedicated app secret without untrusted code execution
