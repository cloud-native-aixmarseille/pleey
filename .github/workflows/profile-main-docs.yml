---
name: Temporary - Profile main Helm docs scope

"on":
  pull_request:
    branches: [main]

permissions: {}

jobs:
  profile:
    if: github.event.pull_request.number == 553 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Replay unchanged and changed documentation inputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { performance } = require('node:perf_hooks');
            const { needsHelmDocs } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-helm-docs.mjs`).href);
            const historical = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 43426111766 })).data;
            if (historical.head_sha !== '437c94c50f301436782e48720e16ce0dbea74751' || historical.conclusion !== 'success') {
              throw new Error('Unexpected historical main run.');
            }
            for (const scenario of ['unchanged', 'changed']) {
              const sha = scenario === 'unchanged' ? historical.head_sha : context.sha;
              await exec.exec('git', ['checkout', '--detach', sha], { silent: true });
              const source = {
                ...context, repo: context.repo, eventName: 'push', ref: 'refs/heads/main', sha,
                runId: scenario === 'unchanged' ? historical.id : context.runId,
                payload: { repository: { default_branch: 'main' } },
              };
              // Replay the history available before that historical push. The
              // changed scenario uses today's real successful main baseline.
              const readOnlyGithub = {
                rest: { actions: {
                  listWorkflowRuns: (parameters) => github.rest.actions.listWorkflowRuns({
                    ...parameters,
                    ...(scenario === 'unchanged' ? { created: `<${historical.created_at}` } : {}),
                  }),
                } },
              };
              const started = performance.now();
              const required = await needsHelmDocs({ github: readOnlyGithub, context: source, attempt: 1 });
              const seconds = (performance.now() - started) / 1000;
              if (required !== (scenario === 'changed')) throw new Error(`Unexpected ${scenario} result: ${required}`);
              core.info(`DOCS_SCOPE_PROFILE ${JSON.stringify({ scenario, sha, required, seconds })}`);
            }
