---
name: Temporary - Profile repository lint

"on":
  pull_request:
    branches: [main]

permissions: {}

jobs:
  profile:
    if: github.event.pull_request.number == 553 && github.event.pull_request.head.repo.full_name == github.repository
    name: Profile lint statuses (${{ matrix.multi-status }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        multi-status: ["true", "false"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Profile pinned Super-Linter
        uses: docker://ghcr.io/hoverkraft-tech/docker-base-images/super-linter:2.0.1@sha256:7fbeb0e47711e939db09027b64d2b4f405dd271dad056fe42dc05ac15a6ddab0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: "false"
          VALIDATE_JAVASCRIPT_TOOLCHAIN: biome
          VALIDATE_PYTHON_TOOLCHAIN: ruff-format
          VALIDATE_BIOME_FORMAT: "false"
          VALIDATE_BIOME_LINT: "false"
          KUBERNETES_KUBECONFORM_OPTIONS: -ignore-missing-schemas -ignore-filename-pattern .*Chart\.yaml -ignore-filename-pattern .*values.*\.yaml -ignore-filename-pattern .*values\.schema\.json -ignore-filename-pattern charts/.*/templates/.* -ignore-filename-pattern charts/.*/crds/.*
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: "true"
          SAVE_SUPER_LINTER_SUMMARY: "true"
          SUPER_LINTER_OUTPUT_DIRECTORY_NAME: super-linter-output
          SUPER_LINTER_SUMMARY_FILE_NAME: super-linter-summary.md
          MULTI_STATUS: ${{ matrix.multi-status }}
          LOG_LEVEL: INFO
          SAVE_SUPER_LINTER_OUTPUT: "true"

      - name: Save diagnostic outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-profile-${{ github.run_attempt }}-${{ matrix.multi-status }}
          path: super-linter-output/
          if-no-files-found: error
          retention-days: 7
