---
name: Pull request - Continuous Integration

"on":
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scope:
    name: Determine PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: scope
        uses: $/.github/actions/determine-pr-checks

  ci:
    needs: scope
    uses: $/.github/workflows/__shared-ci.yml
    with:
      documentation-only: ${{ needs.scope.outputs.scope == 'documentation' }}
    permissions:
      actions: read
      attestations: write
      checks: write
      contents: read
      deployments: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write

  ci-result:
    name: Validate PR checks
    # Enforce the complete result set, including which skips the selected route permits.
    if: always()
    needs: [scope, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CLASSIFICATION_RESULT: ${{ needs.scope.result }}
          WORKFLOW_RESULT: ${{ needs.ci.result }}
          JOB_RESULTS: ${{ needs.ci.outputs.job-results }}
        with:
          script: |
            const script = require('node:url').pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-pr-routing.mjs`);
            const { assertCiResult } = await import(script.href);
            assertCiResult({
              scope: process.env.CI_SCOPE,
              classification: process.env.CLASSIFICATION_RESULT,
              workflow: process.env.WORKFLOW_RESULT,
              jobs: JSON.parse(process.env.JOB_RESULTS || 'null'),
            });
            core.info(`Validated all expected ${process.env.CI_SCOPE} CI results.`);
