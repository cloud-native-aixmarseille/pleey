---
name: "• 🚀 Release"

"on":
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.plan-release.outputs.tag }}
      name: ${{ steps.plan-release.outputs.name }}
    steps:
      - id: plan-release
        uses: hoverkraft-tech/ci-github-publish/actions/release/plan@80fa7011b27f49f2e04a19f932d36047d17a28f2 # 3.0.7
        with:
          github-token: ${{ github.token }}

  ci:
    needs: [plan-release]
    uses: $/.github/workflows/__shared-ci.yml
    with:
      production-image-tag: ${{ needs.plan-release.outputs.tag }}
    permissions:
      actions: read
      attestations: write
      checks: write
      contents: read
      deployments: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write

  prepare-release-files:
    needs: [plan-release, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-sha: ${{ steps.generate-docs.outputs.merged-sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update chart image defaults
        uses: hoverkraft-tech/ci-github-container/actions/helm/update-chart-values@7442ea53022a6365d3be7259634aaaf095bf5d3f # 4.0.0
        with:
          path: charts/application
          values: >-
            [
              {
                "file":"charts/backend/values.yaml",
                "path":".image.tag",
                "value":"${{ fromJSON(needs.ci.outputs.built-prod-images).backend.tags[0] }}"
              },
              {
                "file":"charts/backend/values.yaml",
                "path":".image.digest",
                "value":"${{ fromJSON(needs.ci.outputs.built-prod-images).backend.digest }}"
              },
              {
                "file":"charts/frontend/values.yaml",
                "path":".image.tag",
                "value":"${{ fromJSON(needs.ci.outputs.built-prod-images).frontend.tags[0] }}"
              },
              {
                "file":"charts/frontend/values.yaml",
                "path":".image.digest",
                "value":"${{ fromJSON(needs.ci.outputs.built-prod-images).frontend.digest }}"
              },
              {
                "file":"Chart.yaml",
                "path":".version",
                "value":"${{ needs.plan-release.outputs.tag }}"},
              {
                "file":"Chart.yaml",
                "path":".appVersion",
                "value":"${{ needs.plan-release.outputs.tag }}"},
              {
                "file":"Chart.yaml",
                "path":"(.dependencies[] | select(.repository == \"file://charts/frontend\").version)",
                "value":"${{ needs.plan-release.outputs.tag }}"
              },
              {
                "file":"Chart.yaml",
                "path":"(.dependencies[] | select(.repository == \"file://charts/backend\").version)",
                "value":"${{ needs.plan-release.outputs.tag }}"
              },
              {
                "file":"charts/backend/Chart.yaml",
                "path":".version",
                "value":"${{ needs.plan-release.outputs.tag }}"
                },
              {
                "file":"charts/backend/Chart.yaml",
                "path":".appVersion",
                "value":"${{ needs.plan-release.outputs.tag }}"
              },
              {
                "file":"charts/frontend/Chart.yaml",
                "path":".version",
                "value":"${{ needs.plan-release.outputs.tag }}"
              },
              {
                "file":"charts/frontend/Chart.yaml",
                "path":".appVersion",
                "value":"${{ needs.plan-release.outputs.tag }}"
              }
            ]

      - name: Set up Helm
        uses: hoverkraft-tech/ci-github-container/actions/helm/setup@7442ea53022a6365d3be7259634aaaf095bf5d3f # 4.0.0

      - name: Refresh umbrella Chart.lock
        shell: bash
        run: helm dependency update charts/application

      - name: Regenerate Helm chart documentation
        id: generate-docs
        uses: hoverkraft-tech/ci-github-container/actions/helm/generate-docs@18eb44d394746f292429fb1232a6c9d886e75d8d # Preview: Container PR #985; replace with release before merge
        with:
          working-directory: ./charts
          checkout-ref: ""
          github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] repository automation uses a dedicated app secret without untrusted code execution

  draft-release:
    needs: [plan-release, prepare-release-files]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.create-release.outputs.tag }}
    steps:
      - id: create-release
        uses: hoverkraft-tech/ci-github-publish/actions/release/create@80fa7011b27f49f2e04a19f932d36047d17a28f2 # 3.0.7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # zizmor: ignore[secrets-outside-env] Gemini credential is scoped to release summarization
        with:
          tag: ${{ needs.plan-release.outputs.tag }}
          target-ref: ${{ needs.prepare-release-files.outputs.release-sha }}
          publish: "false"
          changelog-summary: |
            {
              "llmAuth": ${{ toJSON(env.GEMINI_API_KEY) }},
              "llmProvider": "google-genai",
              "llmModel": "gemini-3.8-flash"
            }
          github-token: ${{ github.token }}

  validate-release-chart:
    name: Validate final release chart
    needs: [plan-release, prepare-release-files]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-ci.yml@7442ea53022a6365d3be7259634aaaf095bf5d3f # 4.0.0
    permissions:
      contents: read
      packages: read
    with:
      path: charts/application
      ref: ${{ needs.prepare-release-files.outputs.release-sha }}
      name: ${{ github.event.repository.name }}
      tag: ${{ needs.plan-release.outputs.tag }}
      helm-repositories: |
        cloudnative-pg https://cloudnative-pg.github.io/charts
        valkey https://valkey.io/valkey-helm/
        bokysan https://bokysan.github.io/docker-postfix/
      helm-set: |
        backend.cloudnativepgOperator.enabled=true
        global.imagePullSecrets[0].name=regcred
      oci-registry: ${{ vars.OCI_REGISTRY }}
      oci-registry-username: ${{ github.repository_owner }}
      upload-artifact: true

  publish-release-artifacts:
    name: Publish validated release chart
    needs: [validate-release-chart, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: helm-chart-publication-${{ github.repository_id }}-${{ vars.OCI_REGISTRY }}-${{ github.repository }}/charts/application
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Require validated artifact identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ needs.validate-release-chart.outputs.artifact-id }}
          ARCHIVE_NAME: ${{ needs.validate-release-chart.outputs.archive-name }}
          CHECKSUM: ${{ needs.validate-release-chart.outputs.checksum }}
        with:
          script: |
            const path = require('node:path');
            const { ARTIFACT_ID, ARCHIVE_NAME, CHECKSUM } = process.env;
            if (!/^[1-9][0-9]*$/.test(ARTIFACT_ID) || !/^[a-f0-9]{64}$/.test(CHECKSUM)
              || !ARCHIVE_NAME.endsWith('.tgz') || path.basename(ARCHIVE_NAME) !== ARCHIVE_NAME) {
              throw new Error('Successful validation must supply one artifact ID, archive basename and checksum.');
            }

      - name: Download exact validated archive
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate-release-chart.outputs.artifact-id }}
          path: ${{ runner.temp }}/helm-publish-${{ needs.validate-release-chart.outputs.artifact-id }}
          digest-mismatch: error

      - name: Publish and sign unchanged archive
        uses: hoverkraft-tech/ci-github-container/actions/helm/release-chart@7442ea53022a6365d3be7259634aaaf095bf5d3f # 4.0.0
        with:
          archive: ${{ steps.download.outputs.download-path }}/${{ needs.validate-release-chart.outputs.archive-name }}
          checksum: ${{ needs.validate-release-chart.outputs.checksum }}
          oci-registry: ${{ vars.OCI_REGISTRY }}
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ github.token }}
          oci-repository: ${{ github.repository }}/charts/application

      - name: Clean downloaded archive
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ needs.validate-release-chart.outputs.artifact-id }}
        with:
          script: |
            if (/^[1-9][0-9]*$/.test(process.env.ARTIFACT_ID)) {
              const path = require('node:path');
              require('node:fs').rmSync(path.join(process.env.RUNNER_TEMP, `helm-publish-${process.env.ARTIFACT_ID}`), {
                recursive: true, force: true,
              });
            }

  publish-release:
    needs: [draft-release, publish-release-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: hoverkraft-tech/ci-github-publish/actions/release/update@80fa7011b27f49f2e04a19f932d36047d17a28f2 # 3.0.7
        with:
          tag: ${{ needs.draft-release.outputs.tag }}
          publish: "true"
          github-token: ${{ github.token }}
