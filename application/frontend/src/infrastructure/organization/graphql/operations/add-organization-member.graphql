mutation AddOrganizationMember($organizationId: ID!, $input: AddOrganizationMemberInput!) {
  addOrganizationMember(organizationId: $organizationId, input: $input) {
    id
    organizationId
    userId
    username
    role
    assignableRoles
    permissions {
      updateRole {
        allowed
        reason
      }
      remove {
        allowed
        reason
      }
    }
    joinedAt
  }
}
