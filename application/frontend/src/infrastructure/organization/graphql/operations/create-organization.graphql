mutation CreateOrganization($input: CreateOrganizationInput!) {
  createOrganization(input: $input) {
    id
    name
    description
    createdAt
    updatedAt
    defaultPartySettings {
      allowJoiningAfterStart
      allowOptionChangeAfterVoting
      randomizeOptionOrder
      randomizeStageOrder
    }
    defaultThemeId
    role
    assignableRoles
    permissions {
      read {
        allowed
        reason
      }
      update {
        allowed
        reason
      }
      createProject {
        allowed
        reason
      }
      manageMembers {
        allowed
        reason
      }
    }
  }
}
