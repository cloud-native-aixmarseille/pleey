query WorkspaceOrganizationDashboard($organizationId: ID!) {
  organizationDashboard(organizationId: $organizationId) {
    organization {
      id
      name
      description
      role
      assignableRoles
      permissions {
        read {
          allowed
          reason
        }
        update {
          allowed
          reason
        }
        createProject {
          allowed
          reason
        }
        manageMembers {
          allowed
          reason
        }
      }
    }
    stats {
      totalGames
      totalMembers
      totalProjects
    }
  }
}
