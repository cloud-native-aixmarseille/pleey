query OrganizationMembers($input: OrganizationMembersInput!) {
  organizationMembers(input: $input) {
    items {
      id
      organizationId
      userId
      username
      role
      assignableRoles
      permissions {
        updateRole {
          allowed
          reason
        }
        remove {
          allowed
          reason
        }
      }
      joinedAt
    }
    totalCount
    overallCount
    page
    pageSize
    totalPages
  }
}
