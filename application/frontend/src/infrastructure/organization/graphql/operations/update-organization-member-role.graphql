mutation UpdateOrganizationMemberRole($memberId: ID!, $input: UpdateOrganizationMemberRoleInput!) {
  updateOrganizationMemberRole(memberId: $memberId, input: $input) {
    id
    organizationId
    userId
    username
    role
    assignableRoles
    permissions {
      updateRole {
        allowed
        reason
      }
      remove {
        allowed
        reason
      }
    }
    joinedAt
  }
}
