query ListThemes($organizationId: ID!, $input: ListThemesInput) {
  listThemes(organizationId: $organizationId, input: $input) {
    permissions {
      read {
        allowed
        reason
      }
      create {
        allowed
        reason
      }
      update {
        allowed
        reason
      }
      uploadAsset {
        allowed
        reason
      }
    }
    items {
      id
      organizationId
      revision
      document
      createdAt
      updatedAt
    }
    totalCount
    overallCount
    page
    pageSize
    totalPages
  }
}
