apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pleey.backend.appSecretName" . }}
  labels:
    {{- include "pleey.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  PLEEY_MANAGED_SECRET: "true"
  {{- if not .Values.captcha.existingSecret.name }}
  CAP_SECRET: {{ include "pleey.backend.capSecret" . | quote }}
  {{- end }}
  {{- if not .Values.auth.existingSecret.name }}
  JWT_SECRET: {{ include "pleey.backend.jwtSecret" . | quote }}
  {{- end }}
  {{- if and (eq (include "pleey.backend.databaseProvider" .) "external") (not .Values.database.external.existingSecret.name) }}
  DATABASE_URL: {{ include "pleey.backend.databaseUrl" . | quote }}
  {{- end }}
  {{- if or (eq .Values.valkey.provider "builtin") (and (eq .Values.valkey.provider "external") (not .Values.valkey.external.existingSecret.name)) }}
  VALKEY_URL: {{ include "pleey.backend.valkeyUrl" . | quote }}
  {{- end }}
  {{- if not .Values.media.existingSecret.name }}
  MEDIA_STORAGE_ACCESS_KEY_ID: {{ required "media.accessKeyId or media.existingSecret.name is required" .Values.media.accessKeyId | quote }}
  MEDIA_STORAGE_SECRET_ACCESS_KEY: {{ required "media.secretAccessKey or media.existingSecret.name is required" .Values.media.secretAccessKey | quote }}
  {{- end }}
