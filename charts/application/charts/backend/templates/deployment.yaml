apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pleey.backend.fullname" . }}
  namespace: {{ include "pleey.backend.namespace" . | quote }}
  labels:
    {{- include "pleey.backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pleey.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        {{- with omit .Values.podAnnotations "checksum/config" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pleey.backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      serviceAccountName: {{ include "pleey.backend.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "pleey.backend.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.waitForDatabase.enabled }}
      initContainers:
        - name: wait-for-database
          image: {{ include "pleey.backend.waitForDatabaseImage" . | quote }}
          imagePullPolicy: {{ include "pleey.backend.waitForDatabaseImagePullPolicy" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - sh
            - -ec
            - |
              until [ -s {{ include "pleey.backend.databaseSecretFile" . | quote }} ]; do
                echo "Waiting for database secret at {{ include "pleey.backend.databaseSecretFile" . }}..."
                sleep 2
              done
          resources:
            {{- toYaml .Values.waitForDatabase.resources | nindent 12 }}
          volumeMounts:
            - name: database-secret
              mountPath: {{ include "pleey.backend.databaseSecretMountPath" . }}
              readOnly: true
      {{- end }}
      containers:
        - name: backend
          image: {{ include "pleey.backend.image" . | quote }}
          imagePullPolicy: {{ include "pleey.backend.imagePullPolicy" . }}
          command:
            - sh
            - -ec
            - |
              export JWT_SECRET="$(cat {{ include "pleey.backend.jwtSecretFile" . }})"
              export DATABASE_URL="$(cat {{ include "pleey.backend.databaseSecretFile" . }})"
              export VALKEY_URL="$(cat {{ include "pleey.backend.valkeySecretFile" . }})"
              exec /usr/bin/dumb-init -- node --max-old-space-size=384 /usr/src/app/dist/app/main.js
          envFrom:
            - configMapRef:
                name: {{ include "pleey.backend.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.smtp.enabled }}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/pleey-secrets/smtp-ca/ca.crt
            {{- else if .Values.passwordRecovery.smtp.existingSecret.name }}
            - name: SMTP_USER_FILE
              value: /var/run/pleey-secrets/smtp/username
            - name: SMTP_PASSWORD_FILE
              value: /var/run/pleey-secrets/smtp/password
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- toYaml (omit .Values.startupProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-secret
              mountPath: {{ include "pleey.backend.jwtSecretMountPath" . }}
              readOnly: true
            - name: database-secret
              mountPath: {{ include "pleey.backend.databaseSecretMountPath" . }}
              readOnly: true
            - name: valkey-secret
              mountPath: {{ include "pleey.backend.valkeySecretMountPath" . }}
              readOnly: true
            {{- if .Values.smtp.enabled }}
            - name: smtp-ca
              mountPath: /var/run/pleey-secrets/smtp-ca
              readOnly: true
            {{- else if .Values.passwordRecovery.smtp.existingSecret.name }}
            - name: smtp-secret
              mountPath: /var/run/pleey-secrets/smtp
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jwt-secret
          secret:
            secretName: {{ include "pleey.backend.jwtSecretName" . }}
            items:
              - key: {{ include "pleey.backend.jwtSecretKey" . }}
                path: {{ include "pleey.backend.jwtSecretKey" . }}
        - name: database-secret
          secret:
            secretName: {{ include "pleey.backend.databaseSecretName" . }}
            optional: {{ eq (include "pleey.backend.databaseProvider" .) "cloudnativepg" }}
            items:
              - key: {{ include "pleey.backend.databaseSecretKey" . }}
                path: {{ include "pleey.backend.databaseSecretKey" . }}
        - name: valkey-secret
          secret:
            secretName: {{ include "pleey.backend.valkeySecretName" . }}
            items:
              - key: {{ include "pleey.backend.valkeySecretKey" . }}
                path: {{ include "pleey.backend.valkeySecretKey" . }}
        {{- if .Values.smtp.enabled }}
        - name: smtp-ca
          secret:
            secretName: {{ include "tls.secretName" .Subcharts.smtp | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- else }}
        {{- with .Values.passwordRecovery.smtp.existingSecret }}
        {{- if .name }}
        - name: smtp-secret
          secret:
            secretName: {{ .name | quote }}
            items:
              - key: {{ .userKey | quote }}
                path: username
              - key: {{ .passwordKey | quote }}
                path: password
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
