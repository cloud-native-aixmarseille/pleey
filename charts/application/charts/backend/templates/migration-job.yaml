{{- if .Values.migrationJob.enabled }}
{{- $nameSuffix := printf "-migrate-%d" .Release.Revision }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pleey.backend.fullname" . | trunc (int (sub 63 (len $nameSuffix))) | trimSuffix "-" }}{{ $nameSuffix }}
  labels:
    {{- include "pleey.backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-migration
  {{- with .Values.migrationJob.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "pleey.backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      serviceAccountName: {{ include "pleey.backend.serviceAccountName" . }}
      {{- include "pleey.backend.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.waitForDatabase.enabled }}
      initContainers:
        - name: wait-for-database
          image: {{ include "pleey.backend.image" . | quote }}
          imagePullPolicy: {{ include "pleey.backend.imagePullPolicy" . }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - node
            - /usr/src/app/scripts/wait-for-database.mjs
          args:
            - --secret-file
            - {{ include "pleey.backend.databaseSecretFile" . | quote }}
            - --timeout-ms
            - {{ mul .Values.waitForDatabase.timeoutSeconds 1000 | quote }}
          resources:
            {{- toYaml .Values.waitForDatabase.resources | nindent 12 }}
          volumeMounts:
            - name: database-secret
              mountPath: {{ include "pleey.backend.databaseSecretMountPath" . }}
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "pleey.backend.image" . | quote }}
          imagePullPolicy: {{ include "pleey.backend.imagePullPolicy" . }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -ec
            - |
              export DATABASE_URL="$(cat {{ include "pleey.backend.databaseSecretFile" . }})"
              exec /usr/src/app/node_modules/.bin/prisma migrate deploy
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-secret
              mountPath: {{ include "pleey.backend.databaseSecretMountPath" . }}
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: database-secret
          secret:
            secretName: {{ include "pleey.backend.databaseSecretName" . }}
            optional: false
            items:
              - key: {{ include "pleey.backend.databaseSecretKey" . }}
                path: {{ include "pleey.backend.databaseSecretKey" . }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
