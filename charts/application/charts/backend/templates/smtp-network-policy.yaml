{{- if .Values.smtp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mail.fullname" .Subcharts.smtp }}
  labels:
    {{- include "pleey.backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mail.selectorLabels" .Subcharts.smtp | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pleey.backend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 587
{{- end }}
