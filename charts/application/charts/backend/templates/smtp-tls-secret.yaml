{{- if and .Values.smtp.enabled (not .Values.smtp.tls.existingSecret) }}
{{- $name := include "tls.secretName" .Subcharts.smtp }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "pleey.backend.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if $existing }}
  ca.crt: {{ required "Bundled SMTP TLS Secret must contain ca.crt" (index $existing.data "ca.crt") | quote }}
  tls.crt: {{ required "Bundled SMTP TLS Secret must contain tls.crt" (index $existing.data "tls.crt") | quote }}
  tls.key: {{ required "Bundled SMTP TLS Secret must contain tls.key" (index $existing.data "tls.key") | quote }}
  {{- else }}
  {{- $host := include "mail.fullname" .Subcharts.smtp }}
  {{- $names := list $host (printf "%s.%s" $host .Release.Namespace) (printf "%s.%s.svc" $host .Release.Namespace) (printf "%s.%s.svc.cluster.local" $host .Release.Namespace) }}
  {{- $days := int .Values.smtp.tls.validityDays }}
  {{- $ca := genCA (printf "%s-ca" $host) $days }}
  {{- $cert := genSignedCert $host nil $names $days $ca }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  {{- end }}
{{- end }}
