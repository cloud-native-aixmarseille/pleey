---
global:
  applicationName: pleey-app
  fullnameOverride: ""
  imageRegistry: ""
  imagePullPolicy: Always
  imagePullSecrets: []
  storageClass: ""
imagePullSecrets: []
replicaCount: 1
image:
  registry: ""
  repository: ghcr.io/cloud-native-aixmarseille/pleey/backend
  tag: 0.6.0
  digest: sha256:49d1f9e2ee504ab2824115d56a5a7fa6bc0cd80c966dbcc7471f31232493f0d6
  pullPolicy: ""
service:
  type: ClusterIP
  port: 3001
  targetPort: 3001
  annotations: {}
config:
  # -- Runtime metadata for telemetry and third-party tooling; behavior uses the explicit flags below.
  nodeEnv: production
  corsOrigin: "*"
  # -- Runtime application version. Empty uses Chart.appVersion when rendering the ConfigMap.
  appVersion: ""
  apiBaseUrl: ""
  # -- Comma-separated trusted ingress IPs/CIDRs for client-IP rate limits. Empty trusts no proxy.
  trustedProxyCidrs: ""
  otelExporterOtlpEndpoint: ""
  otelExporterOtlpHeaders: ""
  otelConsoleDiagnosticsEnabled: false
  otelConsoleExportersEnabled: false
  otelConsoleLogsEnabled: false
  # -- Enable the GraphiQL browser interface explicitly.
  graphiqlEnabled: false
  # -- Permit GraphQL introspection explicitly.
  graphqlIntrospectionEnabled: false
  # -- Optional generated GraphQL schema file; empty keeps the schema in memory.
  graphqlSchemaOutputPath: ""
  # -- Watch translation files for changes. Keep disabled for immutable container images.
  i18nWatchEnabled: false
  partySessionRecoveryWindowMs: 300000
  playableContentImportMaxFileSizeBytes: 5242880
media:
  # -- Existing S3-compatible bucket endpoint; the chart does not provision storage or a CDN.
  endpoint: ""
  region: "us-east-1"
  bucket: ""
  # -- Signed delivery base URL; private origin must verify every request with caching disabled.
  publicBaseUrl: ""
  # -- Presigned GET grant lifetime in seconds (60–900).
  accessTtlSeconds: 300
  requireHttps: true
  forcePathStyle: false
  # -- Use an existing Secret for production. Inline credentials are supported for ephemeral CI deployments only.
  accessKeyId: ""
  secretAccessKey: ""
  existingSecret:
    name: ""
    accessKeyIdKey: MEDIA_STORAGE_ACCESS_KEY_ID
    secretAccessKeyKey: MEDIA_STORAGE_SECRET_ACCESS_KEY
  processing:
    timeoutMs: 120000
    concurrency: 1
    memoryLimitMb: 1024
auth:
  # -- Signing key for both access and refresh tokens; empty generates and preserves a release-scoped key.
  jwtSecret: ""
  accessTokenLifetimeSeconds: 3600
  refreshTokenLifetimeSeconds: 1209600
  existingSecret:
    name: ""
    jwtSecretKey: JWT_SECRET
captcha:
  existingSecret:
    # -- Existing signing Secret. Empty generates and preserves a release-scoped secret.
    name: ""
    # -- Secret key containing at least 32 random bytes, mounted as CAP_SECRET_FILE.
    key: CAP_SECRET
passwordRecovery:
  # -- Required trusted public frontend origin for reset links.
  frontendUrl: ""
  # -- Require HTTPS for the public frontend origin, independently of NODE_ENV.
  requireHttps: true
  # -- Password reset token lifetime in minutes.
  tokenLifetimeMinutes: 30
  smtp:
    # -- Required external SMTP hostname when smtp.enabled=false.
    host: ""
    port: 587
    # -- External SMTP implicit TLS (usually port 465). The bundled relay always uses STARTTLS.
    secure: false
    # -- Require TLS for external SMTP. The bundled relay always requires STARTTLS.
    requireTls: true
    # -- Required sender mailbox, optionally including a display name.
    from: ""
    existingSecret:
      # -- External SMTP credentials Secret. Ignored when the bundled relay is enabled.
      name: ""
      # -- Key mounted as SMTP_USER_FILE. Restart backend pods after rotating Secret contents.
      userKey: SMTP_USER
      # -- Key mounted as SMTP_PASSWORD_FILE.
      passwordKey: SMTP_PASSWORD
smtp:
  # -- Deploy the bundled Postfix outgoing relay. Set false to use passwordRecovery.smtp externally.
  enabled: true
  nameOverride: smtp
  fullnameOverride: ""
  image:
    repository: boky/postfix
    tag: 5.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 587
  tls:
    # -- Existing TLS Secret with ca.crt, tls.crt and tls.key. Empty generates and reuses a release-scoped certificate.
    existingSecret: ""
    # -- Generated certificate lifetime. See the deployment guide for renewal before expiry.
    validityDays: 365
  # TLS wiring to the upstream chart. Use smtp.tls.existingSecret for operator-managed certificates.
  certs:
    create: false
    existingSecret: '{{ default (printf "%s-tls" (include "mail.fullname" .)) .Values.tls.existingSecret }}'
  config:
    general:
      # -- Space-separated sender domains allowed by Postfix; required when the bundled relay is enabled.
      ALLOWED_SENDER_DOMAINS: ""
    postfix:
      smtpd_tls_security_level: encrypt
  # -- Existing Secret of upstream relay settings, e.g. RELAYHOST_USERNAME/RELAYHOST_PASSWORD. See upstream chart documentation.
  existingSecret: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  pod:
    labels:
      app.kubernetes.io/component: smtp
    securityContext:
      seccompProfile:
        type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
database:
  # -- Database backend. `cloudnativepg` creates a Cluster custom resource for
  # an already-available CloudNativePG operator, while `external` uses an
  # existing PostgreSQL connection string or secret. Setting
  # `database.external.url` forces external mode.
  provider: cloudnativepg
  auth:
    database: pleeydb
    username: pleeyapp
  cloudnativepg:
    clusterName: ""
    instances: 1
    imageName: ghcr.io/cloudnative-pg/postgresql:17.6
    storage:
      size: 1Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: 128MB
    monitoring:
      enablePodMonitor: false
    backup: {}
    annotations: {}
  external:
    # -- Setting this URL forces external database mode even when
    # `database.provider` is left at `cloudnativepg`.
    url: ""
    host: ""
    port: 5432
    existingSecret:
      name: ""
      key: DATABASE_URL
cloudnativepgOperator:
  # -- Opt in when this chart should also install the CloudNativePG operator.
  # Leave disabled when the operator is managed separately in the cluster.
  enabled: false
# cloudnative-pg mirrors the upstream dependency name. This intentionally keeps
# the upstream chart name because aliasing it breaks CloudNativePG operator
# bootstrap expectations.
cloudnative-pg:
  fullnameOverride: cloudnativepg-operator
  crds:
    create: false
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  webhook:
    mutating:
      failurePolicy: Ignore
    validating:
      failurePolicy: Ignore
valkey:
  # Additional official valkey/valkey values can be passed through under this block.
  enabled: true
  provider: builtin
  nameOverride: ""
  fullnameOverride: ""
  external:
    url: ""
    existingSecret:
      name: ""
      key: VALKEY_URL
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: 9.0.2
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 6379
    annotations: {}
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
waitForDatabase:
  enabled: true
  image:
    registry: docker.io
    repository: busybox
    tag: "1.37.0"
    digest: sha256:b8d1827e38a1d49cd17217efd7b07d689e4ea1744e39c7dcbb95533d175bea65
    pullPolicy: ""
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
migrationJob:
  enabled: true
  backoffLimit: 3
  annotations: {}
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 30
  periodSeconds: 5
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
podAnnotations: {}
podLabels: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
topologySpreadConstraints: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
