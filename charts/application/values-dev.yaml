---
backend:
  media:
    endpoint: http://media-storage:8333
    bucket: pleey-media
    publicBaseUrl: http://media.pleey.k8s.orb.local/pleey-media
    requireHttps: false
    forcePathStyle: true
    # Deploy S3/CDN separately and create this Secret before installing the chart.
    existingSecret:
      name: pleey-media
  image:
    tag: main
    digest: ""
  config:
    nodeEnv: development
    graphiqlEnabled: true
    graphqlIntrospectionEnabled: true
  smtp:
    enabled: false
  passwordRecovery:
    frontendUrl: http://pleey.k8s.orb.local
    requireHttps: false
    smtp:
      # Deploy Mailpit separately in the same namespace, or override this host
      # with a mail server reachable from the backend pod. The bundled relay is disabled.
      host: mailpit
      port: 1025
      requireTls: false
      from: Pleey <noreply@pleey.localhost>
frontend:
  image:
    tag: main
    digest: ""
  config:
    apiUrl: http://pleey.k8s.orb.local
gateway:
  ingress:
    className: traefik-1768864371
    host: pleey.k8s.orb.local
