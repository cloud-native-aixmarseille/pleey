name: pleey-production

services:
  caddy:
    image: ${PLEEY_PROXY_IMAGE:?Set PLEEY_PROXY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PLEEY_DOMAIN: ${PLEEY_DOMAIN:?Set PLEEY_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - pleey

  web:
    image: ${PLEEY_WEB_IMAGE:?Set PLEEY_WEB_IMAGE}
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pleey
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    image: ${PLEEY_API_IMAGE:?Set PLEEY_API_IMAGE}
    restart: unless-stopped
    init: true
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      APP_VERSION: ${PLEEY_RELEASE_ID:?Set PLEEY_RELEASE_ID}
      FRONTEND_URL: https://${PLEEY_DOMAIN}
      FRONTEND_REQUIRE_HTTPS: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL:?Set VALKEY_URL}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      MEDIA_STORAGE_ENDPOINT: ${MEDIA_STORAGE_ENDPOINT:?Set MEDIA_STORAGE_ENDPOINT}
      MEDIA_STORAGE_REGION: ${MEDIA_STORAGE_REGION:-us-east-1}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-pleey-media}
      MEDIA_STORAGE_ACCESS_KEY_ID: ${MEDIA_STORAGE_ACCESS_KEY_ID:?Set MEDIA_STORAGE_ACCESS_KEY_ID}
      MEDIA_STORAGE_SECRET_ACCESS_KEY: ${MEDIA_STORAGE_SECRET_ACCESS_KEY:?Set MEDIA_STORAGE_SECRET_ACCESS_KEY}
      MEDIA_STORAGE_FORCE_PATH_STYLE: ${MEDIA_STORAGE_FORCE_PATH_STYLE:-true}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?Set MEDIA_PUBLIC_BASE_URL}
      MEDIA_REQUIRE_HTTPS: "true"
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - pleey
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  migration:
    image: ${PLEEY_API_IMAGE:?Set PLEEY_API_IMAGE}
    restart: "no"
    working_dir: /usr/src/repository/application/backend
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL:-}
    command:
      [
        "./node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--config",
        "prisma.config.ts",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pleey

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pleey}
      POSTGRES_USER: ${POSTGRES_USER:-pleey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pleey
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pleey} -d ${POSTGRES_DB:-pleey}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - pleey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  media-storage:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=${MEDIA_STORAGE_BUCKET:-pleey-media}
    volumes:
      - media-data:/data
      - ${SEAWEED_S3_CONFIG:?Set SEAWEED_S3_CONFIG}:/etc/seaweedfs/s3.json:ro
    networks:
      - pleey

networks:
  pleey:

volumes:
  postgres-data:
  valkey-data:
  media-data:
  caddy-data:
  caddy-config:
