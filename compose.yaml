# Docker Compose V2 - Development Configuration
# Optimized with BuildKit cache mounts and multi-stage builds
# Using Traefik for reverse proxy to avoid port collisions

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pleeyapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pleeyapp_password}
      - POSTGRES_DB=${POSTGRES_DB:-pleeydb}
      - POSTGRES_TEST_DB=${POSTGRES_TEST_DB:-pleeydb_test}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - pleey-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pleeyapp} -d ${POSTGRES_DB:-pleeydb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    # No port binding - use docker exec or expose via Traefik if needed
    # For database tools, you can still use: docker exec -it pleey-postgres psql

  # Valkey (Redis-compatible) - shared session state for WebSockets
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    networks:
      - pleey-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.29.0
    restart: unless-stopped
    expose:
      - "8025"
      - "1025"
    networks:
      - pleey-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.pleey.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=http"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "traefik.docker.network=traefik-proxy"

  # Development S3 origin. Credentials are development-only and defined in docker/media/s3.json.
  media-storage:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=pleey-media
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    volumes:
      - media-data:/data
      - ./docker/media/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
    networks:
      - pleey-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Browser delivery boundary: signed reads, CORS and byte ranges.
  media-delivery:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./docker/media/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      media-storage:
        condition: service_healthy
    networks:
      - pleey-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=Host(`media.pleey.localhost`)"
      - "traefik.http.routers.media.entrypoints=http"
      - "traefik.http.services.media.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-proxy"

  # Backend NestJS (dev watch mode)
  backend:
    build:
      dockerfile: application/backend/Dockerfile
      target: dev
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}" # Keep host-mounted files writable by the local user
    volumes:
      - ./application/backend:/usr/src/app
      - ./scripts:/usr/src/shared-scripts:ro
    expose:
      - "3001"
    environment:
      - FRONTEND_URL=http://pleey.localhost
      - FRONTEND_REQUIRE_HTTPS=false
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - SMTP_REQUIRE_TLS=false
      - SMTP_FROM=Pleey <noreply@pleey.localhost>
      - PASSWORD_RESET_TOKEN_LIFETIME_MINUTES=30
      - NODE_ENV=development
      - APP_VERSION=${APP_VERSION:-dev}
      - PORT=3001
      - GRAPHQL_GRAPHIQL_ENABLED=true
      - GRAPHQL_INTROSPECTION_ENABLED=true
      - GRAPHQL_SCHEMA_OUTPUT_PATH=src/schema.gql
      - I18N_WATCH_ENABLED=true
      - PARTY_SESSION_RECOVERY_WINDOW_MS=300000
      - PLAYABLE_CONTENT_IMPORT_MAX_FILE_SIZE_BYTES=5242880
      - MEDIA_STORAGE_ENDPOINT=http://media-storage:8333
      - MEDIA_STORAGE_REGION=us-east-1
      - MEDIA_STORAGE_BUCKET=pleey-media
      - MEDIA_STORAGE_ACCESS_KEY_ID=pleey-media-dev
      - MEDIA_STORAGE_SECRET_ACCESS_KEY=pleey-media-development-secret
      - MEDIA_STORAGE_FORCE_PATH_STYLE=true
      - MEDIA_PUBLIC_BASE_URL=http://media.pleey.localhost/pleey-media
      - MEDIA_REQUIRE_HTTPS=false
      - MEDIA_ACCESS_TTL_SECONDS=300
      - MEDIA_PROCESSING_TIMEOUT_MS=120000
      - MEDIA_PROCESSING_CONCURRENCY=1
      - MEDIA_PROCESSING_MEMORY_LIMIT_MB=1024
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_jwt_refresh_secret_change_me}
      - JWT_ACCESS_EXPIRES_IN_SECONDS=3600
      - JWT_REFRESH_EXPIRES_IN_SECONDS=1209600
      - CAP_SECRET=${CAP_SECRET:-pleey-development-cap-secret-change-before-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pleeyapp}:${POSTGRES_PASSWORD:-pleeyapp_password}@postgres:5432/${POSTGRES_DB:-pleeydb}?schema=public
      - DATABASE_URL_TEST=postgresql://${POSTGRES_USER:-pleeyapp}:${POSTGRES_PASSWORD:-pleeyapp_password}@postgres:5432/${POSTGRES_TEST_DB:-pleeydb_test}?schema=public
      - VALKEY_URL=redis://valkey:6379
      - CORS_ORIGIN=*
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=500
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_CONSOLE_DIAGNOSTICS_ENABLED=false
      - OTEL_CONSOLE_EXPORTERS_ENABLED=false
      - OTEL_CONSOLE_LOGS_ENABLED=false
    depends_on:
      media-storage:
        condition: service_healthy
      media-delivery:
        condition: service_started
      otel-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - pleey-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`pleey.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.backend.entrypoints=http"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.docker.network=traefik-proxy"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/ready', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React (Vite dev server with watch)
  frontend:
    build:
      dockerfile: ./application/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}" # Keep host-mounted files writable by the local user
    volumes:
      - ./application/frontend:/usr/src/app
      - ./application/backend:/usr/src/backend:ro
      - ./scripts:/usr/src/shared-scripts:ro
    expose:
      - "5173"
    depends_on:
      - backend
    networks:
      - pleey-network
      - traefik-proxy
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - VITE_CACHE_DIR=/tmp/pleey-frontend-vite
      - VITE_DEV_PROXY_TARGET=http://backend:3001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`pleey.localhost`) && !PathPrefix(`/api`) && !PathPrefix(`/socket.io`)"
      - "traefik.http.routers.frontend.entrypoints=http"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
      - "traefik.docker.network=traefik-proxy"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  e2e-tests:
    image: mcr.microsoft.com/playwright:v1.56.1-jammy
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    expose:
      - "9323"
    environment:
      - BASE_URL=${BASE_URL:-http://frontend:5173}
      - API_BASE_URL=${API_BASE_URL:-http://backend:3001/api}
      - E2E_ADMIN_EMAIL=${E2E_ADMIN_EMAIL:-admin@pleey.com}
      - E2E_ADMIN_PASSWORD=${E2E_ADMIN_PASSWORD:-admin123}
      - E2E_PLAYER_EMAIL=${E2E_PLAYER_EMAIL:-player@pleey.com}
      - E2E_PLAYER_PASSWORD=${E2E_PLAYER_PASSWORD:-player123}
    volumes:
      - ./e2e:/workspace
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - pleey-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.e2e-tests.rule=Host(`e2e.pleey.localhost`)"
      - "traefik.http.routers.e2e-tests.entrypoints=http"
      - "traefik.http.services.e2e-tests.loadbalancer.server.port=9323"
      - "traefik.docker.network=traefik-proxy"

  otel-collector:
    image: otel/opentelemetry-collector:0.105.0
    restart: unless-stopped
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml
    networks:
      - pleey-network
    healthcheck:
      test: ["CMD", "/otelcol", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  pleey-network:
    driver: bridge
  traefik-proxy:
    name: traefik-proxy
    external: true

volumes:
  media-data:
    driver: local
  postgres-data:
    driver: local
