server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Expose immutable quiz objects only; never expose bucket listing or S3 writes.
    location /pleey-media/quiz/ {
        # Request query strings contain bearer credentials.
        access_log off;
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        if ($request_method = OPTIONS) { return 204; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_set_header Authorization "";
        # S3 signs the browser-visible host, escaped path, and complete query.
        proxy_set_header Host $http_host;
        proxy_pass http://media-storage:8333$request_uri;
        proxy_cache off;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-store" always;
        proxy_force_ranges on;
    }

    location / { return 404; }
}
